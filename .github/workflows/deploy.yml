name: Deploy

# Builds the app and publishes it to GitHub Pages on every push to main.
#
# Pages must be switched on once by hand, under repository Settings > Pages >
# Source: GitHub Actions. The `enablement: true` option on configure-pages looks
# like it would avoid that, but creating a Pages site is not something the
# workflow's GITHUB_TOKEN is permitted to do ("Resource not accessible by
# integration"), so it fails with a less obvious error than simply being off.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The smoke test's browser is not needed in CI, and downloading it on every
  # install would add minutes for nothing.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A broken scheduler or generator ruins the app without throwing, so the
      # tests gate the deploy.
      - run: npm test

      - run: npm run build
        env:
          # Pages serves from a subdirectory, which the service worker's scope
          # has to match.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
