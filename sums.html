<!doctype html>
<html><head><meta charset="utf-8"><title>chambers bench</title></head>
<body style="margin:0;background:#05060a">
<div id="pad" style="display:flex;gap:8px;flex-wrap:wrap"></div>
<script type="module">
import '/src/index.css'
import { newRun } from '/src/sums/run.ts'
import { drawRun } from '/src/sums/draw.ts'

const pad = document.getElementById('pad')
for (const level of [1, 2, 11, 12]) {
  const box = document.createElement('div')
  const c = document.createElement('canvas')
  c.width = 420; c.height = 760
  box.appendChild(c)
  pad.appendChild(box)
  const run = newRun(level, 1300, 3, 0, 7)
  drawRun(c.getContext('2d'), run, { w: c.width, h: c.height, clock: 1.2 })
}
window.__ready = true
</script>
</body></html>
