<!doctype html>
<!--
  A bench for the level transitions, served by the dev server and left out of
  the build (Vite only takes index.html as an entry).

  It exists because six short animations cannot be judged from a diff, and
  driving six games to a finished level to see each one takes minutes.

  The cells are the shape of a phone held upright, which is the shape these
  are watched on. They were landscape once, and that quietly made every
  tile-built scene too small and too wide.

  The stylesheet is in the head and not in each cell, and that is not tidiness.
  Tailwind is not loaded here, so without a rule for it every canvas falls back
  to its intrinsic 300x150 and every scene comes out cropped — and the rule
  used to be written into each cell as innerHTML, which React then threw away
  when it rendered into that same cell. Half the canvases were the size of the
  cell and half were 300x150, and the photographs of both looked plausible.
  `scripts/wipe-shot.mjs` now measures them before it takes a picture.

      npx vite --port 5199
      node scripts/wipe-shot.mjs
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>wipes</title>
    <style>
      body { margin: 0; background: #000 }
      #all { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px }
      .cell { position: relative; height: 520px; background: #0d1016 }
      /* A real phone is twice as tall as it is wide, and these are watched on
         one. Six cells side by side cannot be that shape and still be legible
         on a desktop, so `#all.phone` makes them it and the shot script takes
         one picture in each shape. */
      #all.phone { grid-template-columns: repeat(6, 1fr) }
      #all.phone .cell { height: 100vh }
      /* What `absolute inset-0` and `h-full w-full` would do, if Tailwind were
         loaded on this page. Without them the canvas has no parent with a
         height to be a percentage of, and quietly keeps its intrinsic shape. */
      .cell > div { position: absolute; inset: 0 }
      canvas { display: block; width: 100%; height: 100% }
    </style>
  </head>
  <body>
    <div id="all"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { LevelWipe } from '/src/ui/LevelWipe.tsx'
      const scenes = ['maze', 'cave', 'pipes', 'dungeon', 'road', 'space']
      const titles = ['Level 2', 'Room 4', 'Level 3', 'Level 7', 'Level 5', 'Mars']
      const host = document.getElementById('all')
      /*
       * Mounted on command, not on load.
       *
       * The shot script used to start its stopwatch when the page went quiet,
       * which is minutes in browser terms after these six actually started —
       * so a sample meant for two thirds of the way through landed past the
       * end, and the end is a fade to black. Three black squares, and nothing
       * to say they were not the scenes.
       */
      window.__go = (phone) => {
        host.classList.toggle('phone', !!phone)
        host.replaceChildren()
        scenes.forEach((scene, i) => {
          const box = document.createElement('div')
          box.className = 'cell'
          host.appendChild(box)
          createRoot(box).render(
            React.createElement(LevelWipe, {
              scene,
              title: titles[i],
              // Never advance: this page is only here to be looked at.
              onDone: () => {},
            }),
          )
        })
      }
      window.__ready = true
    </script>
  </body>
</html>
