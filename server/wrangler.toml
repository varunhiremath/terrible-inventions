name = "terrible-inventions-relay"
main = "worker.js"
compatibility_date = "2025-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# One room per code, and the free plan only takes the SQLite-backed kind — which
# suits a relay that stores nothing anyway. `new_classes` here is the older
# key-value kind, and a Cloudflare account that has never had one is no longer
# allowed to make one, so the deploy would be refused.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
