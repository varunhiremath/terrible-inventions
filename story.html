<!doctype html>
<!--
  A bench for one cutscene, served by the dev server and left out of the build
  (Vite only takes index.html as an entry).

  It exists because the only other way to look at a beat is to open the app,
  start the game it belongs to, and sit through the beats before it. The space
  story is forty-three seconds long and the beats that needed checking are the
  last five.

  The cell is the shape of a phone held upright, because that is what these
  are watched on.

  The app's own stylesheet is imported rather than approximated, and that is
  the whole lesson from the transitions bench repeated once more. The cutscene
  sizes itself with `h-full`, `flex-1` and `min-h-0`; with no Tailwind those
  are three class names that do nothing, the canvas is one pixel tall, and
  every photograph comes back black with no error anywhere to say why. The
  first version of this page did exactly that.

      npx vite --port 5199
      node scripts/story-shot.mjs
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>story</title>
    <style>
      body { margin: 0; background: #000 }
      #one { position: relative; width: 420px; height: 880px; background: #0d1016 }
      #one > div { position: absolute; inset: 0 }
      canvas { display: block; width: 100%; height: 100% }
    </style>
  </head>
  <body>
    <div id="one"></div>
    <script type="module">
      import '/src/index.css'
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { Intro } from '/src/intro/Intro.tsx'
      import { STORIES } from '/src/intro/stories.ts'
      import { beatStart } from '/src/intro/timeline.ts'

      const host = document.getElementById('one')
      const root = createRoot(host)

      /*
       * Mounted on command, and remounted per beat.
       *
       * The cutscene times itself from the moment it mounts, and it has no way
       * in from outside to say "start at beat seven". So each shot unmounts it
       * and mounts it again, then waits out the beats in front of the one
       * being photographed. Slow, and the only honest way to photograph the
       * thing the player actually watches rather than a scene called directly.
       */
      window.__beats = (id) => STORIES[id].beats.map((b, i) => ({
        i, scene: b.scene, voice: b.voice, line: b.line,
        at: beatStart(STORIES[id], i), seconds: b.seconds,
      }))
      window.__go = (id) => {
        root.render(null)
        return new Promise((done) => setTimeout(() => {
          root.render(React.createElement(Intro, { story: STORIES[id], onDone: () => {} }))
          setTimeout(done, 60)
        }, 60))
      }
      window.__size = () => {
        const c = host.querySelector('canvas')
        return c ? [c.width, c.height] : null
      }
      window.__ready = true
    </script>
  </body>
</html>
