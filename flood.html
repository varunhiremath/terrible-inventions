<!doctype html>
<!--
  The flood at five water levels, served by the dev server and left out of the
  build.

  The only question worth asking about this screen is whether you can tell at a
  glance how much trouble somebody is in, and that cannot be answered from one
  picture of an empty tank.

      npx vite --port 5199
      node scripts/flood-shot.mjs
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>flood</title>
    <style>
      body { margin: 0; background: #05060a; color: #8a91ab;
             font: 11px ui-monospace, monospace }
      #all { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 6px }
      .cell { position: relative; height: 780px }
      canvas { display: block; width: 100%; height: 100% }
      .tag { position: absolute; top: 2px; left: 4px; z-index: 2 }
    </style>
  </head>
  <body>
    <div id="all"></div>
    <script type="module">
      import { newRun, step, grab, reach, release, findsOn } from '/src/sums/run.ts'
      import { drawRun } from '/src/sums/draw.ts'
      const host = document.getElementById('all')
      // A fresh board, one mid-drag, one just after a big find, and two
      // deeper chambers where the sequences have arrived.
      const shots = [
        { level: 1, rating: 1000, water: 0.1, drag: 0 },
        { level: 1, rating: 1000, water: 0.35, drag: 1 },
        { level: 5, rating: 1150, water: 0.55, drag: 1 },
        { level: 9, rating: 1250, water: 0.8, drag: 2 },
        { level: 13, rating: 1400, water: 0.96, drag: 0 },
      ]
      for (let i = 0; i < shots.length; i++) {
        const shot = shots[i]
        const cell = document.createElement('div')
        cell.className = 'cell'
        const tag = document.createElement('span')
        tag.className = 'tag'
        cell.appendChild(tag)
        const canvas = document.createElement('canvas')
        cell.appendChild(canvas)
        host.appendChild(cell)
        const box = canvas.getBoundingClientRect()
        canvas.width = Math.round(box.width * 2)
        canvas.height = Math.round(box.height * 2)
        const ctx = canvas.getContext('2d')

        let run = newRun(shot.level, shot.rating, 3, 0, i + 3)
        // Crush a couple first, so some of it is falling.
        for (let n = 0; n < shot.drag; n++) {
          const found = findsOn(run.cells, 1)[0]
          if (!found) break
          run = grab(run, found.cells[0])
          for (const c of found.cells.slice(1)) run = reach(run, c)
          run = release(run)
          for (let f = 0; f < 60; f++) run = step(run, 1 / 60)
        }
        // And leave one half-dragged, so the green shows.
        const found = findsOn(run.cells, 1)[0]
        let says = 'fresh'
        if (found) {
          run = grab(run, found.cells[0])
          for (const c of found.cells.slice(1)) run = reach(run, c)
          says = run.reading ? run.reading.says : 'dragging'
        }
        tag.textContent = `chamber ${shot.level} · ${run.band.name} · ${says}`
        drawRun(ctx, { ...run, water: shot.water }, { w: canvas.width, h: canvas.height, clock: 1.2 })
      }
      window.__ready = true
    </script>
  </body>
</html>
